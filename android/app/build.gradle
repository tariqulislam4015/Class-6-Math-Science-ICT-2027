plugins { id 'com.android.application' }
android {
    namespace 'com.tisacademy.smartdict'
    compileSdk 34
    defaultConfig {
        applicationId "com.tisacademy.smartdict"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "2027.4"
    }
    // Fixed signing key so every APK built by GitHub Actions can update the previous one.
    // For a Play Store release, replace this with your own private keystore.
    signingConfigs {
        shared {
            storeFile file('../tis-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { minifyEnabled false; signingConfig signingConfigs.shared }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    aaptOptions { noCompress 'jpg', 'png' }
    // The web app in /docs (also served on GitHub Pages) is packaged as the APK's assets
    sourceSets { main { assets.srcDirs = ['../../docs'] } }
}
