.prof:after{width:180px;height:180px;right:-60px;bottom:-60px;background:radial-gradient(circle,#7fb0ef,transparent 65%);animation-delay:-6s}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function dec(s){return String(s||'').normalize('NFC').replace(/য়/g,'য়').replace(/ড়/g,'ড়').replace(/ঢ়/g,'ঢ়').replace(/৷/g,'।');}
function nrm(s){return dec(s).toLowerCase().replace(/[০-৯]/g,function(d){return BND.indexOf(d);});}
function key(s){return nrm(s).replace(/[\s.\-()।,]/g,'');}
function isBn(s){return /[ঀ-৿]/.test(s);}
function rxEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function hl(text,needles){
  var t=dec(text),n=nrm(t);if(n.length!==t.length)n=t.toLowerCase();
  var ranges=[];
  needles.filter(Boolean).map(nrm).filter(function(x){return x.trim().length>0;}).sort(function(a,b){return b.length-a.length;}).forEach(function(nd){
    var lat=/^[a-z]/.test(nd),re=new RegExp(rxEsc(nd).replace(/\s+/g,'\\s+'),'g'),m;
    while((m=re.exec(n))){var s=m.index,e=s+m[0].length;if(m[0].length===0){re.lastIndex++;continue;}while(e<n.length&&/[\u0981-\u0983\u09BC\u09BE-\u09CD\u09D7\u200C\u200D]/.test(n.charAt(e)))e++;if(lat&&s>0&&/[a-z]/.test(n.charAt(s-1)))continue;if(!ranges.some(function(r){return s<r[1]&&e>r[0];}))ranges.push([s,e]);}
  });
  ranges.sort(function(a,b){return a[0]-b[0];});
  var out='',p=0;ranges.forEach(function(r){out+=esc(t.slice(p,r[0]))+'<mark>'+esc(t.slice(r[0],r[1]))+'</mark>';p=r[1];});
  return out+esc(t.slice(p));
}

      o=bk.s.map(function(x){return sentHTML(x,nd,b==='ev');}).join('');

      if(bk.pages.length)o+='<div style="margin-top:10px;font-size:12.5px;color:var(--muted)">'+(b==='bv'?'যেসব পৃষ্ঠায় আছে:':'Found on pages:')+'</div><div class="pgs">'+bk.pages.map(function(p){return '<span class="pg">'+(b==='bv'?bnNum(p):p)+'</span>';}).join('')+'</div>';
    }
    document.getElementById('bbody').innerHTML=o;
    if(bk.img&&window.TIS_IMG_URL&&!window.TIS_IMG)loadImgs(function(){var im=document.querySelector('#bbody img[data-n]');if(im){im.src=imgSrc(im.getAttribute('data-n'));im.parentNode.setAttribute('data-zoom',im.src);}});
    [].forEach.call(document.querySelectorAll('#btabs button'),function(x){x.classList.toggle('on',x.getAttribute('data-b')===b);});
  }
  body(S.dir);
  document.getElementById('btabs').onclick=function(e){var b=e.target.closest('button');if(b)body(b.getAttribute('data-b'));};
  document.getElementById('sayEn').onclick=function(){speak(t.en.replace(/\(.*?\)/g,''),'en-US');};
  document.getElementById('sayBn').onclick=function(){speak(t.bn,'bn-BD');};
  document.getElementById('favB').onclick=function(){var i=S.fav.indexOf(uid);if(i>=0)S.fav.splice(i,1);else S.fav.push(uid);store('fav',S.fav);this.textContent=i>=0?'☆ প্রিয়তে যোগ':'★ প্রিয়';toast(i>=0?'প্রিয় থেকে সরানো হয়েছে':'প্রিয়তে যোগ হয়েছে');};
  document.getElementById('cpB').onclick=function(){var s=t.bn+' — '+t.en+'\n'+t.dbn+'\n'+t.den+(t.fx?'\nসূত্র: '+t.fx.replace(/<[^>]+>/g,''):'')+'\n— Class 6 (Math, Science, ICT) 2027 · TIS-Academy';if(window.TISNative&&TISNative.copy){TISNative.copy(s);toast('কপি হয়েছে');return;}try{navigator.clipboard.writeText(s).then(function(){toast('কপি হয়েছে');},function(){toast('কপি করা যায়নি');});}catch(e){toast('কপি করা যায়নি');}};
}
function speak(s,lang){if(window.TISNative&&TISNative.speak){try{TISNative.speak(s,lang);return;}catch(e){}}try{var u=new SpeechSynthesisUtterance(s);u.lang=lang;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){toast('এই ডিভাইসে উচ্চারণ সুবিধা নেই');}}
function chGrid(sj){return '<div class="sec-t">'+SUBJ[sj].icon+' '+SUBJ[sj].bn+' · '+SUBJ[sj].en+'</div><div class="grid">'+SUBJ[sj].CH.map(function(c,i){var n=RAW[sj].terms.filter(function(t){return t.ch===i+1;}).length;return '<button class="ch '+sj+'" data-go="#/chapter/'+sj+'/'+(i+1)+'"><span class="n">'+bnNum(i+1)+'</span><b>'+(S.dir==='bv'?c[0]:c[1])+'</b><small>'+(S.dir==='bv'?c[1]:c[0])+' · '+bnNum(n)+'টি</small></button>';}).join('')+'</div>';}
function vChapters(only){var sj=only||(S.subj==='all'?null:S.subj);V.innerHTML=sj?chGrid(sj):chGrid('m')+chGrid('s')+chGrid('i');}
function vChapter(sj,n){var c=SUBJ[sj]&&SUBJ[sj].CH[n-1];if(!c){vChapters();return;}var list=T.filter(function(t){return t.sj===sj&&t.ch===n;});V.innerHTML='<div class="hero '+sj+'"><div class="l1">'+SUBJ[sj].icon+' অধ্যায় '+bnNum(n)+': '+c[0]+'</div><div class="l2">Chapter '+n+': '+c[1]+'</div><div class="tags"><span>'+SUBJ[sj].bn+'</span><span>'+bnNum(list.length)+'টি শব্দ</span></div></div>'+list.map(function(t){return resItem(t);}).join('');}
function vFav(){var list=S.fav.map(function(i){return byId[i];}).filter(Boolean);V.innerHTML=list.length?'<div class="count">'+bnNum(list.length)+'টি প্রিয় শব্দ</div>'+list.map(function(t){return resItem(t);}).join(''):'<div class="empty"><b>☆</b>এখনো কোনো প্রিয় শব্দ নেই।<br>যেকোনো শব্দ খুলে “☆ প্রিয়তে যোগ” চাপুন।</div>';}
function vFormulas(){var html='';['m','s','i'].forEach(function(sj){if(!inSubj(sj))return;SUBJ[sj].CH.forEach(function(c,i){var l=T.filter(function(t){return t.sj===sj&&t.ch===i+1&&t.fx;});if(!l.length)return;html+='<div class="sec-t">'+SUBJ[sj].icon+' '+SUBJ[sj].bn+' · অধ্যায় '+bnNum(i+1)+' · '+c[0]+'</div><div class="card">'+l.map(function(t){return '<div class="fxrow" data-term="'+t.uid+'"><b>'+esc(t.bn)+' · '+esc(t.en)+'</b><div>'+t.fx.split('▪').join('<br>')+'</div></div>';}).join('')+'</div>';});});V.innerHTML='<div class="hero"><div class="l1">∑ সূত্র ও সমীকরণ</div><div class="l2">Formulas &amp; Equations</div></div>'+html;}
function vBook(q){
  var html='<div class="card"><div class="lbl">বইয়ের পূর্ণ-পাঠ অনুসন্ধান</div><div style="font-size:14px;color:var(--muted)">উপরের বক্সে যেকোনো শব্দ লিখুন — বাংলা ও ইংরেজি বইয়ের মিলে যাওয়া বাক্য হাইলাইটসহ দেখাবে।</div></div>';
  if(!q){V.innerHTML=html;return;}
  var r=search(q),bs=bookSearch(q,r[0]);if(r[0])html+=resItem(r[0],q);
  html+='<div class="tabs" id="bt2"><button data-b="bv">বাংলা ভার্সন ('+bnNum(bs.bv.length)+')</button><button data-b="ev">English Version ('+bs.ev.length+')</button></div><div id="bb2"></div>';V.innerHTML=html;
  var show=function(b){var l=bs[b];document.getElementById('bb2').innerHTML=l.length?'<div class="card">'+l.slice(0,120).map(function(x){return sentHTML(x,b==='bv'?bs.nb:bs.ne,b==='ev');}).join('')+'</div>':'<div class="empty">কোনো বাক্য পাওয়া যায়নি</div>';[].forEach.call(document.querySelectorAll('#bt2 button'),function(x){x.classList.toggle('on',x.getAttribute('data-b')===b);});};
  show(isBn(q)?(bs.bv.length?'bv':'ev'):(bs.ev.length?'ev':'bv'));
  document.getElementById('bt2').onclick=function(e){var b=e.target.closest('button');if(b)show(b.getAttribute('data-b'));};
}
function vQuiz(){
  var P=TS(),qs=[],pool=P.slice();for(var i=0;i<10;i++){var a=pool.splice(Math.floor(Math.random()*pool.length),1)[0];var opts=[a];while(opts.length<4){var o=P[Math.floor(Math.random()*P.length)];if(opts.indexOf(o)<0)opts.push(o);}opts.sort(function(){return Math.random()-.5;});qs.push({a:a,o:opts});}
  var n=0,score=0;
  function render(){
    if(n>=qs.length){V.innerHTML='<div class="card" style="text-align:center"><div style="font-size:48px">🏆</div><div style="font-size:22px;font-weight:800">'+bnNum(score)+' / '+bnNum(qs.length)+'</div><p>'+(score>=8?'অসাধারণ!':score>=5?'ভালো হয়েছে!':'আরও অনুশীলন করো!')+'</p><button class="btn" id="again">আবার খেলুন</button></div>';document.getElementById('again').onclick=vQuiz;return;}
    var q=qs[n],bv=S.dir==='bv';
    V.innerHTML='<div class="count">প্রশ্ন '+bnNum(n+1)+' / '+bnNum(qs.length)+' · স্কোর '+bnNum(score)+'</div><div class="card"><div class="lbl">'+SUBJ[q.a.sj].bn+' · '+(bv?'ইংরেজি পরিভাষা কোনটি?':'What is the Bangla term?')+'</div><div style="font-size:24px;font-weight:800">'+esc(bv?q.a.bn:q.a.en)+'</div>'+q.o.map(function(o,i){return '<button class="qopt" data-i="'+i+'">'+esc(bv?o.en:o.bn)+'</button>';}).join('')+'</div>';
    [].forEach.call(document.querySelectorAll('.qopt'),function(b){b.onclick=function(){var ok=q.o[+b.getAttribute('data-i')]===q.a;if(ok)score++;[].forEach.call(document.querySelectorAll('.qopt'),function(x){x.disabled=true;if(q.o[+x.getAttribute('data-i')]===q.a)x.classList.add('ok');});if(!ok)b.classList.add('no');setTimeout(function(){n++;render();},ok?700:1500);};});
  }
  render();
}
// ---------- router (in-app)
var CUR='#/',STK=[];
function setNav(h){var bb=document.getElementById('backBtn');bb.style.display=STK.length?'grid':'none';[].forEach.call(document.querySelectorAll('nav.bot button'),function(b){var g=b.getAttribute('data-go');b.classList.toggle('on',g==='#/'?h==='#/':h.indexOf(g)===0);});}
function route(){
  var h=CUR,m;setNav(h);
  if((m=h.match(/^#\/term\/(\w+)/)))return vTerm(m[1]);
  if((m=h.match(/^#\/search\?q=(.*)$/)))return vSearch(decodeURIComponent(m[1]));
  if((m=h.match(/^#\/chapter\/(m|s|i)\/(\d+)/)))return vChapter(m[1],+m[2]);
  if((m=h.match(/^#\/chapters\/(m|s|i)/)))return vChapters(m[1]);
  if(h.indexOf('#/chapters')===0)return vChapters();
  if(h.indexOf('#/book')===0){var mm=h.match(/q=(.*)$/);return vBook(mm?decodeURIComponent(mm[1]):qEl.value.trim());}
  if(h.indexOf('#/formulas')===0)return vFormulas();
  if(h.indexOf('#/fav')===0)return vFav();
  if(h.indexOf('#/quiz')===0)return vQuiz();
  if(h.indexOf('#/about')===0)return vAbout();
  vHome();
}
function go(h,replace){if(!replace&&h!==CUR)STK.push(CUR);CUR=h;route();if(!replace)window.scrollTo(0,0);}
function back(){var z=document.getElementById('zoom');if(z.classList.contains('on')){z.classList.remove('on');return true;}if(!STK.length)return false;CUR=STK.pop();route();return true;}
window.TISBack=back;
var qEl=document.getElementById('q'),deb;
qEl.addEventListener('input',function(){clearTimeout(deb);var v=qEl.value;deb=setTimeout(function(){
  if(!v.trim()){if(CUR.indexOf('#/search')===0)back();return;}
  if(isBn(v)&&S.dir!=='bv')setDir('bv',1);else if(!isBn(v)&&/[a-z]/i.test(v)&&S.dir!=='ev')setDir('ev',1);
  var h=(CUR.indexOf('#/book')===0?'#/book?q=':'#/search?q=')+encodeURIComponent(v);
  go(h,CUR.indexOf('#/search')===0||CUR.indexOf('#/book')===0);
},180);});
qEl.addEventListener('keydown',function(e){if(e.key==='Enter')qEl.blur();});
document.getElementById('clr').onclick=function(){qEl.value='';qEl.focus();if(CUR.indexOf('#/search')===0)go('#/');};
function setDir(d,silent){S.dir=d;store('dir',d);[].forEach.call(document.querySelectorAll('#dir button'),function(b){b.classList.toggle('on',b.getAttribute('data-d')===d);});if(!silent)toast(d==='bv'?'বাংলা → English':'English → বাংলা');}
function setSubj(s){S.subj=s;store('subj',s);[].forEach.call(document.querySelectorAll('#subj button'),function(b){b.classList.toggle('on',b.getAttribute('data-s')===s);});}
document.getElementById('dir').onclick=function(e){var b=e.target.closest('button');if(!b)return;setDir(b.getAttribute('data-d'));route();};
document.getElementById('subj').onclick=function(e){var b=e.target.closest('button');if(!b)return;setSubj(b.getAttribute('data-s'));toast(b.textContent);route();};
setDir(S.dir,1);setSubj(S.subj);
document.addEventListener('click',function(e){
  var el=e.target.closest('a[href^="http"],[data-term],[data-go],[data-q],[data-zoom]');if(!el)return;
  if(el.tagName==='A')return;
  if(el.hasAttribute('data-term'))go('#/term/'+el.getAttribute('data-term'));
  else if(el.hasAttribute('data-go'))go(el.getAttribute('data-go'));
  else if(el.hasAttribute('data-q')){qEl.value=el.getAttribute('data-q');qEl.dispatchEvent(new Event('input'));}
  else if(el.hasAttribute('data-zoom')){var z=document.getElementById('zoom'),zi=document.getElementById('zimg');zi.src=el.getAttribute('data-zoom');zw=180;zi.style.width='180%';z.classList.add('on');}
});
var zw=180;function zs(d){zw=Math.max(100,Math.min(400,zw+d));document.getElementById('zimg').style.width=zw+'%';}
document.getElementById('zin').onclick=function(){zs(40);};document.getElementById('zout').onclick=function(){zs(-40);};
document.getElementById('zclose').onclick=function(){document.getElementById('zoom').classList.remove('on');};
document.getElementById('backBtn').onclick=function(){back();};
function applyTheme(){var dk=S.dark===null?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches):S.dark;document.documentElement.classList.toggle('dark',!!dk);document.getElementById('themeBtn').textContent=dk?'☀️':'🌙';}
document.getElementById('themeBtn').onclick=function(){S.dark=!document.documentElement.classList.contains('dark');store('dark',S.dark);applyTheme();};
applyTheme();route();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.TIS_IMG_URL){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
})();
</script>
