name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['docs/**', 'android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../Class-6-Math-Science-ICT-2027.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Class-6-Math-Science-ICT-2027-APK
          path: Class-6-Math-Science-ICT-2027.apk
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Class 6 (Math, Science, ICT) 2027 — Android APK (latest)
          body: |
            Class 6 (Math, Science, ICT) 2027 — ষষ্ঠ শ্রেণি গণিত · বিজ্ঞান · আইসিটি ডিকশনারি — Android APK।
            ডাউনলোড করে মোবাইলে ইনস্টল করুন (প্রয়োজনে "Install unknown apps" অনুমতি দিন)।
            Built automatically from commit ${{ github.sha }}.
          files: Class-6-Math-Science-ICT-2027.apk
          make_latest: true
